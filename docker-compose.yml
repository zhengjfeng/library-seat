version: '3.8'
services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - MAX_BOOKING_HOURS=${MAX_BOOKING_HOURS}
      - MAX_BOOKING_DAYS=${MAX_BOOKING_DAYS}
      - MAX_CONCURRENT_BOOKINGS=${MAX_CONCURRENT_BOOKINGS}
      - BOOKING_GRACE_MINUTES=${BOOKING_GRACE_MINUTES}
    depends_on:
      - db
      - redis
  worker:
    build: .
    command: npm run worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - BOOKING_GRACE_MINUTES=${BOOKING_GRACE_MINUTES}
    depends_on:
      - db
      - redis
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  db-data:
